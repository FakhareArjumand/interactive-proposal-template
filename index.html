<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal | Arjumand Labs</title>
    <style>
        :root {
            /* Apple iOS Dark Mode Palette */
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --card-hover: #2C2C2E;
            --accent: #0A84FF;
            --text-main: #FFFFFF;
            --text-muted: #8E8E93;
            --border: rgba(255, 255, 255, 0.15);
            --border-hover: rgba(255, 255, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Native Apple Typography */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2rem;
            margin-bottom: 3rem;
        }

        .agency-name { 
            font-size: 1.75rem; 
            font-weight: 700; 
            letter-spacing: -0.5px;
        }
        
        .agency-subtitle {
            color: var(--text-muted); 
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .client-info { text-align: right; color: var(--text-muted); font-size: 0.95rem; }
        .client-info strong { color: var(--text-main); font-weight: 600; }

        h2 { 
            margin-bottom: 1.5rem; 
            font-size: 1.35rem; 
            font-weight: 600; 
            letter-spacing: -0.3px;
        }

        .module-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 3rem;
        }

        .module-card {
            background: var(--card-bg);
            border: 1px solid transparent;
            padding: 1.25rem 1.5rem;
            border-radius: 16px; /* Apple squircle look */
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .module-card:hover { 
            background: var(--card-hover); 
        }

        .module-info h3 { 
            font-size: 1.1rem; 
            font-weight: 600;
            margin-bottom: 0.25rem; 
            letter-spacing: -0.2px;
        }
        
        .module-info p { 
            color: var(--text-muted); 
            font-size: 0.95rem; 
            max-width: 480px; 
        }

        .module-controls {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .price { 
            font-weight: 500; 
            font-size: 1.15rem; 
            letter-spacing: -0.3px;
        }

        /* Apple-style Checkbox */
        input[type="checkbox"] {
            appearance: none;
            width: 28px;
            height: 28px;
            border: 1.5px solid var(--border-hover);
            border-radius: 50%; /* Circular like iOS selections */
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease-in-out;
        }

        input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        input[type="checkbox"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .total-section {
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(20px); /* Apple Glassmorphism */
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label { font-size: 1.1rem; color: var(--text-muted); font-weight: 500;}
        .total-price { font-size: 2.5rem; font-weight: 700; color: var(--text-main); letter-spacing: -1px;}

        .print-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 2rem;
            width: 100%;
            transition: transform 0.1s ease, opacity 0.2s;
        }
        
        .print-btn:active { transform: scale(0.98); }
        .print-btn:hover { opacity: 0.9; }

        /* Responsive Design */
        @media (max-width: 600px) {
            body { padding: 1.25rem; }
            header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .client-info { text-align: left; }
            .module-card { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .module-controls { width: 100%; justify-content: space-between; }
            .total-section { flex-direction: column; align-items: flex-start; gap: 0.5rem; padding: 1.5rem; }
        }

        /* Print formatting: Inverts to white background to save client ink */
        @media print {
            body { background: white; color: black; }
            .module-card, .total-section { background: white; border: 1px solid #E5E5EA; }
            .print-btn { display: none; }
            .agency-name, .price, .total-price, .client-info strong { color: black; }
            input[type="checkbox"] { border-color: #C7C7CC; }
            input[type="checkbox"]:checked { background: #000; border-color: #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <div class="agency-name">Arjumand Labs</div>
            <p class="agency-subtitle">Enterprise Software Architecture</p>
        </div>
        <div class="client-info">
            <p>Prepared for: <strong>Demo Client Inc.</strong></p>
            <p>Date: <strong id="current-date"></strong></p>
        </div>
    </header>

    <h2>Project Scope & Investment</h2>

    <div class="module-group">
        <!-- Core Module (Checked & Disabled by default) -->
        <label class="module-card">
            <div class="module-info">
                <h3>Core Platform Foundation</h3>
                <p>Database architecture, user authentication, and core API development.</p>
            </div>
            <div class="module-controls">
                <span class="price">$3,500</span>
                <input type="checkbox" class="scope-toggle" data-price="3500" checked disabled>
            </div>
        </label>

        <!-- Optional Module -->
        <label class="module-card">
            <div class="module-info">
                <h3>Multi-Tenant Architecture</h3>
                <p>Isolated PostgreSQL schemas and Row-Level Security for SaaS capabilities.</p>
            </div>
            <div class="module-controls">
                <span class="price">$1,200</span>
                <input type="checkbox" class="scope-toggle" data-price="1200" checked>
            </div>
        </label>

        <!-- Optional Module -->
        <label class="module-card">
            <div class="module-info">
                <h3>WhatsApp Bot Integration (Echo)</h3>
                <p>Automated reminders and webhook handling directly to client phones.</p>
            </div>
            <div class="module-controls">
                <span class="price">$850</span>
                <input type="checkbox" class="scope-toggle" data-price="850">
            </div>
        </label>
    </div>

    <div class="total-section">
        <div class="total-label">Estimated Investment</div>
        <div class="total-price" id="display-total">$0</div>
    </div>

    <button class="print-btn" onclick="window.print()">Export as PDF</button>
</div>

<script>
    // Set current date
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

    // Interactive Price Calculator
    const toggles = document.querySelectorAll('.scope-toggle');
    const displayTotal = document.getElementById('display-total');

    function calculateTotal() {
        let total = 0;
        toggles.forEach(toggle => {
            if (toggle.checked) {
                total += parseInt(toggle.dataset.price);
            }
        });
        // Format with commas
        displayTotal.textContent = '$' + total.toLocaleString('en-US');
    }

    // Add listeners to all checkboxes
    toggles.forEach(toggle => {
        toggle.addEventListener('change', calculateTotal);
    });

    // Initial calculation on load
    calculateTotal();
</script>

</body>
</html>
